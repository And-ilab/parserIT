# ИТ-тендеры ЕИС (zakupki.gov.ru) — отдельная Telegram-группа.
# Расписание: +3 ч после ИТ icetrade → ~03:00 и ~15:00 Минск (00:00 и 12:00 UTC).
#
# Если нет schedule-run много дней: Actions → этот workflow может быть Disabled
# (disabled_inactivity на public repo без push ~60 дней). Enable workflow + Run.
# Keepalive: .github/workflows/keepalive-repo-activity.yml
#
name: Run zakupki IT parser on server

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: powershell

env:
  TENDER_IT_DIR: 'C:\tender_it'

jobs:
  parser:
    runs-on: self-hosted
    steps:
      - name: Debug identity and tools
        run: |
          whoami
          (Get-Command git -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          (Get-Command python -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)

      - name: Git pull main
        env:
          GH_PULL_PAT: ${{ secrets.GH_PULL_PAT }}
        run: |
          if (-not (Test-Path -LiteralPath $env:TENDER_IT_DIR)) {
            Write-Error "Directory missing: $($env:TENDER_IT_DIR)"
          }
          Set-Location -LiteralPath $env:TENDER_IT_DIR
          $sd = (Get-Location).Path
          $opt = "safe.directory=$sd"
          if ($env:GH_PULL_PAT -and $env:GH_PULL_PAT.Trim().Length -gt 0) {
            $u = "https://x-access-token:$($env:GH_PULL_PAT)@github.com/${{ github.repository }}.git"
            git -c $opt remote set-url origin $u
          }
          git -c $opt fetch origin
          git -c $opt checkout main
          git -c $opt pull origin main
          git -c $opt log -1 --oneline

      - name: pip install
        run: |
          Set-Location -LiteralPath $env:TENDER_IT_DIR
          if (Test-Path -LiteralPath 'requirements.txt') {
            python -m pip install -q -r requirements.txt
          }

      # Если секрет ZAKUPKI_TELEGRAM_CHAT_ID в GitHub не создан, Actions передаёт пустую
      # переменную — парсер подхватит C:\tender_it\.env (см. icetrade_parser_core._load_dotenv_if_present).
      - name: Run zakupki_it_parser.py
        env:
          ZAKUPKI_TELEGRAM_CHAT_ID: ${{ secrets.ZAKUPKI_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ZAKUPKI_TELEGRAM_BOT_TOKEN: ${{ secrets.ZAKUPKI_TELEGRAM_BOT_TOKEN }}
        run: |
          Set-Location -LiteralPath $env:TENDER_IT_DIR
          python zakupki_it_parser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Join-Path $env:TENDER_IT_DIR 'zakupki_it_parser_log.txt'
          if (Test-Path -LiteralPath $log) {
            Select-String -LiteralPath $log -Pattern 'Telegram \[zakupki|telegram_delivery|КРИТИЧЕСКАЯ|❌|НОВЫЙ' | Select-Object -Last 15
          }

      - name: Log schedule completion (UTC) on server
        if: always()
        run: |
          Set-Location -LiteralPath $env:TENDER_IT_DIR
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $rid = '${{ github.run_id }}'
          $line = ('{0:u} run-zakupki-it-parser-on-server finished run_id={1}' -f [datetime]::UtcNow, $rid)
          Add-Content -LiteralPath (Join-Path $env:TENDER_IT_DIR 'logs\gh-actions-schedule-zakupki-it.log') -Value $line
